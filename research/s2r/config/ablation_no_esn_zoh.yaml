mission:
  task: bring_pen
  instruction: Go bring me a pen from the table somewhere in the lab
  rate_hz: 5.0
camera:
  source: mock
  rate_hz: 15.0
  width: 640
  height: 480
vision:
  rate_hz: 5.0
  use_vlm: true
  vlm_every_n: 5
models:
  detector:
    backend: yolo
    model_id: yolov8n.pt
    device: cuda
    mock: true
  vlm:
    model_id: Qwen/Qwen2.5-VL-3B-Instruct
    device: cuda
    mock: true
  reasoner:
    backend: qwen
    model_id: Qwen/Qwen2.5-3B-Instruct
    device: cuda
    mock: true
vla:
  rate_hz: 2.0
  action_dim: 29
  mock: true
esn:
  target_hz: 100
  model_path: data/models/esn_upsample.npz
passthrough:
  mode: zoh
  target_hz: 100
reasoning:
  rate_hz: 5.0
  policy: qwen
data_collection:
  enabled: true
  out_dir: data/raw/ablation_no_esn_zoh
  flush_every: 50
gui:
  host: 0.0.0.0
  port: 8081
  history: 300
deploy:
  nodes:
  - gui
  - camera
  - vision
  - mission
  - state_publisher
  - reasoning
  - vla
  - passthrough
  - sim_bridge
  - data_collector
