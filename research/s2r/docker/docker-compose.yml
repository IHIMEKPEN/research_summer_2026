services:
  s2r:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
      - "5555-5561:5555-5561"
    volumes:
      - ../data:/app/data
      - ../config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python", "-m", "s2r.cli", "deploy", "-c", "config/default.yaml"]
